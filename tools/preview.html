<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jebao Studio · Demo</title><style>body{margin:0}aside{background:#fff1c9;color:#604800;padding:10px 24px;font:13px system-ui}</style><aside>Oberflächenvorschau mit Beispieldaten · Keine Verbindung zu Pumpen</aside><jebao-studio-panel></jebao-studio-panel><script type="module">
import '../custom_components/jebao_studio/panel/jebao-studio.js';
const states={
 'switch.mlw_power':{state:'on',attributes:{friendly_name:'Pumpe'}},
 'number.mlw_flow':{state:'45',attributes:{friendly_name:'Strömungsleistung',min:30,max:100,step:1,unit_of_measurement:'%'}},
 'number.mlw_frequency':{state:'55',attributes:{friendly_name:'Wellenfrequenz',min:0,max:100,step:1}},
 'select.mlw_mode':{state:'sine_wave',attributes:{friendly_name:'Wellenmodus',options:['constant_flow','sine_wave','random_wave','square_wave']}},
 'switch.mlw_feed':{state:'off',attributes:{friendly_name:'Fütterung'}},
 'number.mlw_feedtime':{state:'10',attributes:{friendly_name:'Fütterungsdauer',min:1,max:60,step:1,unit_of_measurement:'min'}},
 'switch.mlw_timeron':{state:'on',attributes:{friendly_name:'Zeitplan'}},
 'select.mlw_linkage':{state:'independent',attributes:{friendly_name:'Kopplung',options:['independent','primary','secondary']}},
 'binary_sensor.mlw_fault':{state:'off',attributes:{friendly_name:'Rotor blockiert'}},
 'switch.mlw_right_power':{state:'on',attributes:{friendly_name:'Pumpe'}},
 'number.mlw_right_flow':{state:'52',attributes:{friendly_name:'Strömungsleistung',min:30,max:100,step:1,unit_of_measurement:'%'}},
 'select.mlw_right_mode':{state:'random_wave',attributes:{friendly_name:'Wellenmodus',options:['constant_flow','sine_wave','random_wave','square_wave']}},
 'switch.mlw_right_feed':{state:'off',attributes:{friendly_name:'Fütterung'}},
};
const panel=document.querySelector('jebao-studio-panel');
const left=['switch.mlw_power','number.mlw_flow','number.mlw_frequency','select.mlw_mode','switch.mlw_feed','number.mlw_feedtime','switch.mlw_timeron','select.mlw_linkage','binary_sensor.mlw_fault'];
const right=['switch.mlw_right_power','number.mlw_right_flow','select.mlw_right_mode','switch.mlw_right_feed'];
const catalog=[{id:'demo-mlw-left',name:'MLW · Riff links',kind:'wavemaker',transport:'local',product_key:'1d8c63eaccac4205b92c84d77d5a08fb',available:true,entities:left.map(entity_id=>({entity_id}))},{id:'demo-mlw-right',name:'MLW · Riff rechts',kind:'wavemaker',transport:'local',product_key:'54114ccdac1e41c0bb17e222887c07ba',available:true,entities:right.map(entity_id=>({entity_id}))},{id:'demo-dmp',name:'DMP · Riff rechts',kind:'bluetooth',transport:'ble_probe',entities:[]},{id:'demo-doser',name:'Dosierung · Vorbereitung',kind:'doser',transport:'local',product_key:'25c5b146791f465bbefdbfd312b9e8ea',available:false,entities:[]}];
let groups=[{id:'riff',name:'Riffströmung',device_ids:['demo-mlw-left','demo-mlw-right']}];
const hass={states,callWS:async msg=>{if(msg.type.endsWith('catalog'))return catalog;if(msg.type.endsWith('groups'))return groups;if(msg.type.endsWith('group_save')){const saved={id:msg.id||'demo-group',name:msg.name,device_ids:msg.device_ids};groups=groups.filter(group=>group.id!==saved.id).concat(saved);return saved;}if(msg.type.endsWith('group_delete')){groups=groups.filter(group=>group.id!==msg.id);return {id:msg.id};}throw new Error('Demo: keine Bluetooth-Verbindung.');},callService:async(domain,service,data)=>{for(const entityId of Array.isArray(data.entity_id)?data.entity_id:[data.entity_id])states[entityId].state=service==='turn_on'?'on':service==='turn_off'?'off':String(data.value??data.option);panel.hass={...hass};}};panel.hass=hass;
</script></html>
